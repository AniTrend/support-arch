[versions]
ktlint = "1.1.1"

gradle-plugin = "9.3.1"

androidx-core = "1.18.0"
androix-lifecycle = "2.11.0"
androix-lifecycle-extensions = "2.2.0"
androidx-paging = "3.5.1"
androidx-preference = "1.2.1"
androidx-recycler = "1.4.0"
androidx-test-ext = "1.3.0"
androidx-work = "2.11.2"

jetbrains-dokka = "2.2.0"
jetbrains-kotlin = "2.4.10"
jetbrains-kotlinx-coroutines = "1.11.0"

io-mockk = "1.14.11"

google-devtools-ksp = "2.3.11"

[plugins]
google-devtools-ksp = { id = "com.google.devtools.ksp", version.ref = "google-devtools-ksp" }
jetbrains-dokka = { id = "org.jetbrains.dokka", version.ref = "jetbrains-dokka" }

[libraries]
threeTenBp = { module = "com.jakewharton.threetenabp:threetenabp", version = "1.4.9" }
timber = { module = "com.jakewharton.timber:timber", version = "5.0.1" }

android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "gradle-plugin" }

androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }

androidx-lifecycle-extensions = { module = "androidx.lifecycle:lifecycle-extensions", version.ref = "androix-lifecycle-extensions" }
androidx-lifecycle-runTime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androix-lifecycle" }
androidx-lifecycle-liveData-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androix-lifecycle" }
androidx-lifecycle-viewModel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androix-lifecycle" }
androidx-lifecycle-liveDataCore-ktx = { module = "androidx.lifecycle:lifecycle-livedata-core-ktx", version.ref = "androix-lifecycle" }

androidx-paging-common = { module = "androidx.paging:paging-common", version.ref = "androidx-paging" }
