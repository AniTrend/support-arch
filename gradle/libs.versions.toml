androidx-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }

androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "androidx-work" }
androidx-work-runtime = { module = "androidx.work:work-runtime", version.ref = "androidx-work" }
androidx-work-test = { module = "androidx.work:work-testing", version.ref = "androidx-work" }

cash-turbine = { module = "app.cash.turbine:turbine", version = "1.2.1" }

google-android-material = { module = "com.google.android.material:material", version = "1.14.0" }

jetbrains-dokka-gradle = { module = "org.jetbrains.dokka:dokka-gradle-plugin", version.ref = "jetbrains-dokka" }
